<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>콘텐츠·미디어 지원사업 현황</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root {
  color-scheme: light;
  --bg: #f2f1ec;
  --surface: #ffffff;
  --surface-2: #f6f5f0;
  --border: #dcd9d0;
  --text: #1c1e22;
  --text-dim: #555a62;
  --text-faint: #7d828a;
  --go: #2c7a55;
  --go-bg: rgba(44,122,85,0.11);
  --info: #2f67bd;
  --info-bg: rgba(47,103,189,0.10);
  --warn: #8f6209;
  --warn-bg: rgba(196,140,30,0.14);
  --urgent: #c4431d;
  --urgent-bg: rgba(196,67,29,0.11);
  --muted: #6a6f77;
  --muted-bg: rgba(106,111,119,0.10);
  --review: #7454bd;
  --review-bg: rgba(116,84,189,0.11);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
  --bg: #15171b;
    --surface: #1b1e23;
    --surface-2: #21252b;
    --border: #2c3038;
    --text: #edeae2;
    --text-dim: #9a9fa6;
    --text-faint: #686d75;
    --go: #4fa37a;
    --go-bg: rgba(79,163,122,0.13);
    --info: #5b8dd9;
    --info-bg: rgba(91,141,217,0.13);
    --warn: #d9a441;
    --warn-bg: rgba(217,164,65,0.13);
    --urgent: #e4572e;
    --urgent-bg: rgba(228,87,46,0.16);
    --muted: #767b83;
    --muted-bg: rgba(118,123,131,0.10);
    --review: #9b7fd4;
    --review-bg: rgba(155,127,212,0.13);
  }
}
html, body { margin:0; padding:0; background: var(--bg); }
body { min-height: 100vh; }

#gd-root {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  border-radius: 0;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0;
  max-width: 100%;
  box-sizing: border-box;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#gd-root * { box-sizing: border-box; }
#gd-root .mono { font-family: 'IBM Plex Mono', monospace; }

#gd-root .wrap { padding: 22px 20px 32px; }

/* ---------- Header ---------- */
#gd-root .hdr {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
}
#gd-root h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
#gd-root .hdr-sub { color: var(--text-dim); font-size: 12.5px; }
#gd-root .today-box {
  text-align: right; font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  background: var(--surface);
  min-width: 168px;
}
#gd-root .today-box .big { color: var(--text); font-size: 15px; font-weight: 600; }

#gd-root .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 20px; }
#gd-root .stat-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 12px; font-size: 12px; color: var(--text-dim); display:flex; gap:6px; align-items:baseline;
}
#gd-root .stat-chip b { color: var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; }

/* ---------- Urgent strip ---------- */
#gd-root .urgent-block {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--urgent);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 22px;
}
#gd-root .urgent-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
#gd-root .urgent-title { font-weight: 600; font-size: 13.5px; color: var(--urgent); display:flex; align-items:center; gap:7px;}
#gd-root .urgent-title .dot { width:7px;height:7px;border-radius:50%;background:var(--urgent); display:inline-block; }
#gd-root .threshold { display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-faint); }
#gd-root .threshold input {
  width: 42px; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:5px; padding:3px 5px; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center;
}
#gd-root .urgent-cards { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
#gd-root .ucard {
  flex: 0 0 auto; min-width: 168px; background: var(--surface-2); border:1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; cursor:pointer; transition: border-color .15s;
}
#gd-root .ucard:hover { border-color: var(--urgent); }
#gd-root .ucard .dday { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color: var(--urgent); line-height:1; }
#gd-root .ucard .dday span { font-size:11px; font-weight:500; margin-left:3px; color: var(--text-faint); }
#gd-root .ucard .uname { font-size:12.5px; margin-top:6px; font-weight:500; }
#gd-root .ucard .uorg { font-size:11px; color: var(--text-dim); margin-top:2px; }
#gd-root .urgent-empty { color: var(--text-faint); font-size:12.5px; padding: 4px 0; }

/* ---------- Filters ---------- */
#gd-root .filters {
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;
}
#gd-root .filters input[type=text], #gd-root .filters select {
  background: var(--surface); border:1px solid var(--border); color: var(--text);
  border-radius:7px; padding:7px 10px; font-size:12.5px; font-family:'Space Grotesk',sans-serif;
}
#gd-root .filters input[type=text] { flex: 1 1 180px; min-width:140px; }
#gd-root .filters select { flex: 0 0 auto; }
#gd-root .filters .count { margin-left:auto; font-size:11.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }

/* ---------- Sections ---------- */
#gd-root .section { margin-bottom: 10px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background: var(--surface); }
#gd-root .sec-head {
  display:flex; align-items:center; justify-content:space-between; padding:11px 14px; cursor:pointer;
  user-select:none;
}
#gd-root .sec-head:hover { background: var(--surface-2); }
#gd-root .sec-left { display:flex; align-items:center; gap:9px; }
#gd-root .sec-bar { width:4px; height:16px; border-radius:2px; }
#gd-root .sec-name { font-weight:600; font-size:13px; }
#gd-root .sec-count { font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--text-faint); }
#gd-root .sec-chevron { color: var(--text-faint); font-size:11px; transition: transform .15s; }
#gd-root .section.collapsed .sec-chevron { transform: rotate(-90deg); }
#gd-root .sec-body { border-top:1px solid var(--border); }
#gd-root .section.collapsed .sec-body { display:none; }

/* ---------- Item row ---------- */
#gd-root .item { border-bottom:1px solid var(--border); }
#gd-root .item:last-child { border-bottom:none; }
#gd-root .item-row { display:flex; gap:12px; padding:11px 14px 11px 12px; cursor:pointer; align-items:flex-start; }
#gd-root .item-row:hover { background: var(--surface-2); }
#gd-root .item-stripe { width:3px; align-self:stretch; border-radius:2px; flex:0 0 3px; margin-top:2px; margin-bottom:2px; }
#gd-root .item-main { flex:1; min-width:0; }
#gd-root .item-top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
#gd-root .item-name { font-weight:600; font-size:13.5px; }
#gd-root .item-org { font-size:11.5px; color: var(--text-dim); }
#gd-root .item-tags { display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center; }
#gd-root .badge {
  font-size:10.5px; padding:2px 7px; border-radius:5px; font-family:'IBM Plex Mono',monospace;
  white-space:nowrap;
}
#gd-root .item-dday { flex:0 0 auto; text-align:right; font-family:'IBM Plex Mono',monospace; padding-top:1px; }
#gd-root .item-dday .num { font-size:17px; font-weight:600; }
#gd-root .item-dday .lbl { font-size:9.5px; color: var(--text-faint); display:block; margin-top:1px;}
#gd-root .item-check { flex:0 0 auto; padding-top:3px; }
#gd-root .item-check input { width:15px; height:15px; accent-color: var(--go); cursor:pointer; }

/* ---------- Detail ---------- */
#gd-root .detail { padding: 4px 14px 16px 29px; font-size:12.5px; color: var(--text-dim); }
#gd-root .detail-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom:12px; }
#gd-root .detail-grid .full { grid-column: 1 / -1; }
#gd-root .dl { font-size:10.5px; text-transform: none; color: var(--text-faint); margin-bottom:3px; letter-spacing:.01em; }
#gd-root .dv { color: var(--text); font-size:12.5px; }
#gd-root .dv a { color: var(--info); text-decoration:none; }
#gd-root .dv a:hover { text-decoration:underline; }
#gd-root .ref-note { background: var(--surface-2); border-radius:6px; padding:8px 10px; font-size:11.5px; color: var(--text-faint); margin-bottom:12px; }
#gd-root textarea.note {
  width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:7px;
  color: var(--text); font-family:'Space Grotesk',sans-serif; font-size:12.5px; padding:8px 10px;
  min-height:52px; resize:vertical;
}
#gd-root .detail-actions { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap;}
#gd-root .checked-line { display:flex; align-items:center; gap:7px; font-size:11.5px; }
#gd-root .checked-line input { accent-color: var(--go); cursor:pointer; }
#gd-root .hide-btn { background:none; border:1px solid var(--border); color: var(--text-faint); border-radius:6px;
  padding:5px 10px; font-size:11px; cursor:pointer; font-family:'Space Grotesk',sans-serif; }
#gd-root .hide-btn:hover { border-color: var(--urgent); color: var(--urgent); }

/* ---------- Add form ---------- */
#gd-root .add-block { border:1px dashed var(--border); border-radius:10px; padding:14px 16px; margin-top:18px; }
#gd-root .add-toggle { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:600; color: var(--text-dim); }
#gd-root .add-form { display:none; grid-template-columns: 1fr 1fr; gap:10px; margin-top:14px; }
#gd-root .add-form.open { display:grid; }
#gd-root .add-form .full { grid-column: 1/-1; }
#gd-root .add-form label { font-size:10.5px; color: var(--text-faint); display:block; margin-bottom:4px; }
#gd-root .add-form input, #gd-root .add-form textarea {
  width:100%; background: var(--surface); border:1px solid var(--border); color: var(--text);
  border-radius:6px; padding:7px 9px; font-size:12.5px; font-family:'Space Grotesk',sans-serif;
}
#gd-root .add-form textarea { min-height:44px; resize:vertical; }
#gd-root .add-submit {
  background: var(--go); color:#0e1611; border:none; border-radius:7px; padding:8px 16px;
  font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Space Grotesk',sans-serif;
}

/* ---------- Footer ---------- */
#gd-root .footer-note { margin-top:20px; font-size:11px; color: var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
#gd-root .reset-btn { background:none; border:none; color: var(--text-faint); text-decoration:underline; cursor:pointer; font-size:11px; font-family:'Space Grotesk',sans-serif; padding:0;}
#gd-root .reset-btn:hover { color: var(--urgent); }
#gd-root .hidden-toggle { color: var(--info); cursor:pointer; text-decoration:underline; background:none; border:none; font-size:11px; font-family:'Space Grotesk',sans-serif; padding:0;}
#gd-root .empty-msg { padding:18px 14px; color: var(--text-faint); font-size:12.5px; text-align:center; }
#gd-root .custom-tag { font-size:9.5px; color: var(--review); border:1px solid var(--review); border-radius:4px; padding:1px 5px; font-family:'IBM Plex Mono',monospace;}

@media (max-width: 560px) {
  #gd-root .detail-grid { grid-template-columns: 1fr; }
  #gd-root .add-form { grid-template-columns: 1fr; }
  #gd-root .hdr { flex-direction: column; }
  #gd-root .today-box { text-align:left; }
}
/* ---------- Data bar & panels ---------- */
#gd-root .data-bar {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
  background: var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px 10px 14px; margin-bottom:12px;
}
#gd-root .db-info { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color: var(--text-dim); align-items:baseline; }
#gd-root .db-info b { color: var(--text); font-weight:600; }
#gd-root .db-src { color: var(--text-faint); }
#gd-root .db-actions { display:flex; flex-wrap:wrap; gap:6px; }
#gd-root .db-stale { flex-basis:100%; font-size:12px; color: var(--warn); background: var(--warn-bg); border-radius:6px; padding:7px 10px; }
#gd-root .btn {
  background: var(--surface-2); color: var(--text); border:1px solid var(--border); border-radius:7px;
  padding:6px 12px; font-size:12.5px; font-family:'Space Grotesk',sans-serif; cursor:pointer; white-space:nowrap;
}
#gd-root .btn:hover { border-color: var(--text-faint); }
#gd-root .btn-primary { background: var(--go); border-color: var(--go); color:#fff; font-weight:600; }
#gd-root .btn-primary:hover { filter: brightness(1.08); border-color: var(--go); }
#gd-root .btn-on { border-color: var(--info); color: var(--info); background: var(--info-bg); }
#gd-root button:focus-visible, #gd-root input:focus-visible, #gd-root select:focus-visible, #gd-root textarea:focus-visible {
  outline: 2px solid var(--info); outline-offset: 2px;
}

#gd-root .panel { background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 16px; margin-bottom:12px; font-size:12.5px; }
#gd-root .panel-go { border-left:3px solid var(--go); }
#gd-root .panel-info { border-left:3px solid var(--info); }
#gd-root .panel-review { border-left:3px solid var(--review); }
#gd-root .pn-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
#gd-root .pn-head b { font-size:13.5px; }
#gd-root .pn-file { font-size:11.5px; color: var(--text-faint); word-break:break-all; }
#gd-root .pn-line { color: var(--text-dim); margin-bottom:6px; }
#gd-root .pn-stats { display:flex; gap:16px; margin:4px 0 8px; color: var(--text-dim); flex-wrap:wrap; }
#gd-root .pn-stats b { font-family:'IBM Plex Mono',monospace; font-size:17px; color: var(--text); margin-right:4px; }
#gd-root .pn-summary { background: var(--surface-2); border-radius:6px; padding:8px 10px; color: var(--text); margin-bottom:8px; }
#gd-root .pn-removed ul { margin:4px 0 6px; padding-left:18px; color: var(--text); }
#gd-root .pn-removed li { margin-bottom:4px; }
#gd-root .pn-org { color: var(--text-faint); font-size:11.5px; }
#gd-root .pn-memo { color: var(--text-dim); font-size:11.5px; margin-top:2px; }
#gd-root .pn-hint { color: var(--text-faint); font-size:11.5px; margin-top:6px; }
#gd-root .pn-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
#gd-root .footer-actions { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
#gd-root .footer-text { max-width: 70ch; }

@media (min-width: 900px) {
  #gd-root .wrap { padding: 30px 32px 48px; }
}
@media (max-width: 640px) {
  #gd-root .wrap { padding: 16px 12px 32px; }
  #gd-root .filters select { flex: 1 1 calc(50% - 4px); min-width: 0; }
  #gd-root .filters input[type=text] { flex: 1 1 100%; }
  #gd-root .filters .count { margin-left: 0; width: 100%; }
  #gd-root input, #gd-root select, #gd-root textarea { font-size: 16px !important; }
  #gd-root .data-bar { flex-direction: column; align-items: stretch; }
  #gd-root .db-actions .btn, #gd-root .pn-actions .btn { flex: 1 1 auto; padding: 9px 12px; }
  #gd-root .item-row { padding: 12px 10px 12px 8px; gap: 10px; }
  #gd-root .detail { padding: 4px 12px 16px 14px; }
  #gd-root .ucard { min-width: 150px; }
  #gd-root .hide-btn { padding: 8px 12px; }
  #gd-root .footer-actions { gap: 10px 16px; }
  #gd-root .today-box { width: 100%; min-width: 0; display: flex; justify-content: space-between; align-items: baseline; }
  #gd-root .stat-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  #gd-root .stat-chip { flex: 0 0 auto; white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  #gd-root * { transition: none !important; scroll-behavior: auto !important; }
}
#gd-root .history { list-style:none; margin:10px 0 2px; padding:0; border-top:1px solid var(--border); }
#gd-root .history li { display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--border); color: var(--text-dim); }
#gd-root .history .hdate { flex:0 0 auto; color: var(--text-faint); font-size:11.5px; padding-top:1px; }
#gd-root .change-note { color: var(--warn); background: var(--warn-bg); }
#gd-root .new-note { color: var(--info); background: var(--info-bg); }

</style>
</head>
<body>
<div id="gd-root"><div class="wrap" id="gd-app">
  <div style="padding:40px 0; text-align:center; color:var(--text-faint); font-size:13px;">불러오는 중…</div>
</div></div>

function todayMidnight(){
  var d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function parseDate(s){
  if(!s) return null;
  var p = s.split('-');
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
function fmtDate(s){
  if(!s) return '';
  var d = parseDate(s);
  var days = ['일','월','화','수','목','금','토'];
  return s + ' (' + days[d.getDay()] + ')';
}
function ddayCalc(target, today){
  return Math.round((target - today) / 86400000);
}

function classify(item, today){
  var basis = item.status_basis;
  if (item.unrel) return { group:'unrelated', label: (item.unrel.indexOf('로케이션') === 0 ? item.unrel : '사업 무관 · ' + item.unrel), dday:null };
  if (item.excl) return { group:'excluded', label: item.excl, dday:null };
  if (item.newfound) {
    var ne = item.end ? parseDate(item.end) : null;
    var ns = item.start ? parseDate(item.start) : null;
    if (ne && ne < today) return { group:'closed', label:'마감', dday: ddayCalc(ne, today) };
    return { group:'newfound', label: (ns && ns > today ? '접수 예정' : '접수 중') + ' · 자격 확인 필요', dday: ne ? ddayCalc(ne, today) : null };
  }
  if (basis === '원문 재확인') {
    return { group:'hold', label:'검증 보류', dday:null };
  }
  if (basis === '공고상 접수기간 내') {
    var end = parseDate(item.end);
    var start = item.start ? parseDate(item.start) : null;
    if (end < today) return { group:'closed', label:'마감', dday: ddayCalc(end, today) };
    if (start && start > today) return { group:'upcoming', label:'접수 예정', dday: ddayCalc(start, today) };
    return { group:'now', label:'접수중', dday: ddayCalc(end, today) };
  }
  if (ROLLING_BASIS[basis]) return { group:'now', label: basis, dday:null };
  if (CLOSED_TEXT_BASIS[basis]) return { group:'closed', label: basis, dday:null };
  if (REVIEW_BASIS[basis]) return { group:'review', label: basis, dday:null };
  // fallback: 기간 미확인류 - 과거 회차 참고 데이터일 수 있으므로 날짜로 마감 판정하지 않음
  var estNext = null, estDays = null;
  if (item.start){
    estNext = estimateNextRound(item.start);
    estDays = ddayCalc(estNext, today);
  }
  return { group:'pending', label: '공고 대기 (다음 회차 미정)', dday:null, estNext: estNext, estDays: estDays };
}
function estimateNextRound(startStr){
  var d = parseDate(startStr);
  return new Date(d.getFullYear()+1, d.getMonth(), d.getDate());
}
function fmtEstDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function money(n){
  if(n === null || n === undefined || n === '') return '미확인';
  var num = Number(n);
  if (isNaN(num)) return String(n);
  return '₩' + num.toLocaleString('ko-KR');
}

function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    d.programs.every(function(p){ return p && p.id && p.name; }));
}
// data.js를 항상 최신으로 받아오도록 주소 끝에 시각을 붙임
function loadDataFile(){
  return new Promise(function(resolve){
    var done = false;
    var s = document.createElement('script');
    s.src = 'data.js?v=' + Date.now();
    s.onload = function(){ if (done) return; done = true; resolve(isValidDataset(window['GRANTS_DATA']) ? window['GRANTS_DATA'] : null); };
    s.onerror = function(){ if (done) return; done = true; resolve(null); };
    setTimeout(function(){ if (!done){ done = true; resolve(null); } }, 10000);
    document.head.appendChild(s);
  });
}

async function loadState(){
  loadSettings();
  var ds = await loadDataFile();
  // 업데이트 중 파일이 잘못 저장됐을 때는 더 최신인 쪽을, 둘 다 없으면 내장 데이터를 보여줌
  if (ds && ds.meta.updated >= EMBEDDED_DATA.meta.updated){ state.active = ds; state.fromFile = true; }
  else { state.active = EMBEDDED_DATA; state.fromFile = false; }
  state.loaded = true;
  render();
}

// 열람 전용: 메모·확인·숨김 기능 없음
function getMeta(id){ return { note:'', checked:false, checkedDate:null, hidden:false }; }

function allItems(){ return state.active.programs; }

// ---------- 업데이트 소식 ----------
var BADGE_DAYS = 14;
function daysSince(dateStr){ if (!dateStr) return null; return ddayCalc(todayMidnight(), parseDate(dateStr)); }
function isRecentNew(it){ var d = daysSince(it.added_on); return d !== null && d >= 0 && d <= BADGE_DAYS; }
function isRecentChanged(it){ var d = daysSince(it.changed_on); return !isRecentNew(it) && d !== null && d >= 0 && d <= BADGE_DAYS; }
function inUpdate(it, date){ return it.added_on === date || it.changed_on === date; }

function changeBadgeHtml(it){
  if (isRecentNew(it)) return '<span class="badge" style="background:var(--info-bg);color:var(--info)" title="'+esc(it.added_on)+' 추가">신규</span>';
  if (isRecentChanged(it)){
    var f = Array.isArray(it.change_fields) ? it.change_fields : [];
    var txt = f.length ? '변경: ' + f.slice(0,2).join(', ') + (f.length > 2 ? ' 외 '+(f.length-2) : '') : '변경';
    var tip = (it.changed_on || '') + (it.change_note ? ' · ' + it.change_note : '');
    return '<span class="badge" style="background:var(--warn-bg);color:var(--warn)" title="'+esc(tip)+'">'+esc(txt)+'</span>';
  }
  return '';
}
function changeDetailHtml(it){
  if (!(isRecentNew(it) || isRecentChanged(it))) return '';
  var t = isRecentNew(it) ? it.added_on + '에 새로 추가된 사업이에요.' :
    it.changed_on + ' 업데이트에서 바뀌었어요' + (Array.isArray(it.change_fields) && it.change_fields.length ? ' (' + it.change_fields.join(', ') + ')' : '') + '.' + (it.change_note ? ' ' + it.change_note : '');
  return '<div class="ref-note '+(isRecentNew(it)?'new-note':'change-note')+'">'+esc(t)+'</div>';
}

function updatesPanelHtml(){
  var ds = state.active;
  var hist = Array.isArray(ds.meta.history) ? ds.meta.history : [];
  var latest = hist[0] || { date: ds.meta.updated, summary: ds.meta.summary || '' };
  var age = daysSince(ds.meta.updated);
  var items = ds.programs;
  var nNew = items.filter(function(it){ return it.added_on === latest.date; }).length;
  var nChg = items.filter(function(it){ return it.changed_on === latest.date && it.added_on !== latest.date; }).length;
  var removed = Array.isArray(latest.removed) ? latest.removed : [];
  var html = '<div class="panel panel-go">';
  html += '<div class="pn-head"><b>업데이트 소식</b><span class="pn-file">마지막 업데이트 <span class="mono">'+esc(ds.meta.updated)+'</span>'+(age !== null && age > 0 ? ' ('+age+'일 전)' : age === 0 ? ' (오늘)' : '')+'</span></div>';
  if (!state.fromFile){
    html += '<div class="db-stale">최신 데이터를 불러오지 못해 저장된 기본 데이터를 보여주고 있어요. 잠시 후 새로고침해 보세요.</div>';
  }
  if (latest.summary) html += '<div class="pn-summary">'+esc(latest.summary)+'</div>';
  if (nNew + nChg + removed.length){
    html += '<div class="pn-stats"><span><b>'+nNew+'</b> 신규</span><span><b>'+nChg+'</b> 변경</span>'+(removed.length?'<span><b>'+removed.length+'</b> 목록에서 빠짐</span>':'')+'</div>';
  }
  if (removed.length){
    html += '<div class="pn-removed"><div class="dl">이번에 목록에서 빠진 사업</div><ul>';
    removed.forEach(function(r){ html += '<li>'+esc(r.name)+' <span class="pn-org">'+esc(r.org||'')+(r.reason?' · '+esc(r.reason):'')+'</span></li>'; });
    html += '</ul></div>';
  }
  html += '<div class="pn-actions">';
  if (nNew + nChg){
    var on = state.filters.recent === latest.date;
    html += '<button class="btn'+(on?' btn-on':'')+'" data-recent="'+esc(latest.date)+'">'+(on?'전체 보기':'이번에 바뀐 사업만 보기')+'</button>';
  }
  if (hist.length > 1){
    html += '<button class="btn" data-toggle-history="1">'+(state.historyOpen?'지난 기록 접기':'지난 업데이트 기록')+'</button>';
  }
  html += '</div>';
  if (state.historyOpen && hist.length > 1){
    html += '<ul class="history">';
    hist.slice(1).forEach(function(h){
      html += '<li><span class="mono hdate">'+esc(h.date)+'</span><span>'+esc(h.summary||'')+'</span></li>';
    });
    html += '</ul>';
  }
  html += '<div class="pn-hint">신규·변경 표시는 '+BADGE_DAYS+'일 동안 붙어 있어요. 매주 자동으로 다시 조사해 갱신돼요.</div>';
  html += '</div>';
  return html;
}

function bindUpdateEvents(){
  root.querySelectorAll('[data-recent]').forEach(function(el){
    el.addEventListener('click', function(){
      var d = el.getAttribute('data-recent');
      state.filters.recent = state.filters.recent === d ? null : d;
      render();
    });
  });
  var th = root.querySelector('[data-toggle-history]');
  if (th) th.addEventListener('click', function(){ state.historyOpen = !state.historyOpen; render(); });
}

function getFieldOptions(items){
  var s = {};
  items.forEach(function(i){ if(i.field) s[i.field]=1; });
  return Object.keys(s).sort();
}
function getOrgOptions(items){
  var s = {};
  items.forEach(function(i){ if(i.org) s[i.org]=1; });
  return Object.keys(s).sort();
}

// ---------- render ----------
var root;
function render(){
  root = document.getElementById('gd-app');
  if (!state.loaded){
    root.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--text-faint);font-size:13px;">불러오는 중…</div>';
    return;
  }
  var today = todayMidnight();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var items = allItems();

  var classified = items.map(function(it){
    var meta = getMeta(it.id);
    var cls = classify(it, today);
    return Object.assign({}, it, { _cls: cls, _meta: meta });
  }).filter(function(it){ return state.showHidden ? true : !it._meta.hidden; });

  // stats (based on non-hidden full set, before search/select filters)
  var counts = {};
  STATUS_ORDER.forEach(function(g){ counts[g]=0; });
  classified.forEach(function(it){ counts[it._cls.group] = (counts[it._cls.group]||0)+1; });
  var alertDays = state.settings.alertDays || 14;
  var urgentItems = classified.filter(function(it){
    return it._cls.group==='now' && it._cls.dday !== null && it._cls.dday <= alertDays;
  }).sort(function(a,b){ return a._cls.dday - b._cls.dday; });

  // filters
  var f = state.filters;
  var filtered = classified.filter(function(it){
    if (f.status !== 'all' && it._cls.group !== f.status) return false;
    if (f.field !== 'all' && it.field !== f.field) return false;
    if (f.org !== 'all' && it.org !== f.org) return false;
    if (f.studio !== 'all' && it.studio_n !== f.studio) return false;
    if (f.scr !== 'all' && it.scr !== f.scr) return false;
    if (f.recent && !inUpdate(it, f.recent)) return false;
    if (f.q){
      var q = f.q.toLowerCase();
      var hay = (it.name+' '+it.org+' '+(it.field||'')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  // group into sections
  var bySection = {};
  STATUS_ORDER.forEach(function(g){ bySection[g] = []; });
  filtered.forEach(function(it){ bySection[it._cls.group].push(it); });
  Object.keys(bySection).forEach(function(g){
    bySection[g].sort(function(a,b){
      if (state.filters.sort === 'dday'){
        var da = a._cls.dday !== null ? a._cls.dday : (a._cls.estDays !== null && a._cls.estDays !== undefined ? 90000 + a._cls.estDays : 999999);
        var db = b._cls.dday !== null ? b._cls.dday : (b._cls.estDays !== null && b._cls.estDays !== undefined ? 90000 + b._cls.estDays : 999999);
        return da - db;
      }
      if (state.filters.sort === 'name') return a.name.localeCompare(b.name, 'ko');
      if (state.filters.sort === 'org') return (a.org||'').localeCompare(b.org||'', 'ko');
      return 0;
    });
  });

  var fieldOpts = getFieldOptions(items);
  var orgOpts = getOrgOptions(items);

  var html = '';

  // header
  html += '<div class="hdr">';
  html += '<div><h1>콘텐츠·미디어 지원사업 현황</h1><div class="hdr-sub">Studio N(서울 소재·대기업 계열) 기준 · 열 때마다 오늘 날짜로 상태와 D-day를 다시 계산해요</div></div>';
  html += '<div class="today-box">오늘<div class="big mono">'+todayStr+'</div></div>';
  html += '</div>';

  html += updatesPanelHtml();

  // stat chips
  html += '<div class="stat-row">';
  html += '<div class="stat-chip">전체 <b>'+filtered.length+'</b>건</div>';
  STATUS_ORDER.forEach(function(g){
    if (counts[g] > 0) html += '<div class="stat-chip">'+STATUS_META[g].name+' <b>'+counts[g]+'</b></div>';
  });
  html += '</div>';

  // Studio N 참여구조 breakdown
  var studioCounts = {};
  classified.forEach(function(it){ if(it.studio_n) studioCounts[it.studio_n] = (studioCounts[it.studio_n]||0)+1; });
  var studioKeys = Object.keys(studioCounts).sort(function(a,b){ return (STUDIO_N_META[a]?STUDIO_N_META[a].order:9) - (STUDIO_N_META[b]?STUDIO_N_META[b].order:9); });
  if (studioKeys.length){
    html += '<div class="stat-row" style="margin-top:-8px;">';
    html += '<div class="stat-chip" style="color:var(--text-faint);">Studio N 참여구조</div>';
    studioKeys.forEach(function(k){
      var m = STUDIO_N_META[k] || {color:'var(--text-dim)'};
      html += '<div class="stat-chip" style="border-color:'+m.color+'55;"><span style="color:'+m.color+'">'+esc(k)+'</span> <b>'+studioCounts[k]+'</b></div>';
    });
    html += '</div>';
  }

  // urgent strip
  html += '<div class="urgent-block">';
  html += '<div class="urgent-head">';
  html += '<div class="urgent-title"><span class="dot"></span>마감 임박</div>';
  html += '<div class="threshold">경보 기준 <input type="number" id="gd-alert-input" min="1" max="180" value="'+alertDays+'"> 일 이내</div>';
  html += '</div>';
  if (urgentItems.length === 0){
    html += '<div class="urgent-empty">'+alertDays+'일 이내 마감 예정인 항목이 없습니다.</div>';
  } else {
    html += '<div class="urgent-cards">';
    urgentItems.forEach(function(it){
      html += '<div class="ucard" data-goto="'+esc(it.id)+'">';
      html += '<div class="dday">D-'+it._cls.dday+'<span>일</span></div>';
      html += '<div class="uname">'+esc(it.name)+'</div>';
      html += '<div class="uorg">'+esc(it.org)+' · '+esc(fmtDate(it.end))+'</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // filters
  html += '<div class="filters">';
  html += '<input type="text" id="gd-search" placeholder="사업명·기관 검색" value="'+esc(f.q)+'">';
  html += '<select id="gd-filter-status"><option value="all">전체 상태</option>';
  STATUS_ORDER.forEach(function(g){ html += '<option value="'+g+'"'+(f.status===g?' selected':'')+'>'+STATUS_META[g].name+'</option>'; });
  html += '</select>';
  html += '<select id="gd-filter-field"><option value="all">전체 분야</option>';
  fieldOpts.forEach(function(o){ html += '<option value="'+esc(o)+'"'+(f.field===o?' selected':'')+'>'+esc(o)+'</option>'; });
  html += '</select>';
  html += '<select id="gd-filter-org"><option value="all">전체 기관</option>';
  orgOpts.forEach(function(o){ html += '<option value="'+esc(o)+'"'+(f.org===o?' selected':'')+'>'+esc(o)+'</option>'; });
  html += '</select>';
  html += '<select id="gd-filter-studio"><option value="all">Studio N 참여구조 전체</option>';
  Object.keys(STUDIO_N_META).forEach(function(k){ html += '<option value="'+esc(k)+'"'+(f.studio===k?' selected':'')+'>'+esc(k)+'</option>'; });
  html += '</select>';
  html += '<select id="gd-filter-scr"><option value="all">대기업 제한 검토 전체</option>';
  ['제한 문구 없음','미확인','제한 가능성 높음','제한 명시'].forEach(function(k){ html += '<option value="'+esc(k)+'"'+(f.scr===k?' selected':'')+'>'+esc(k)+'</option>'; });
  html += '</select>';
  html += '<select id="gd-sort"><option value="dday"'+(f.sort==='dday'?' selected':'')+'>D-day순</option><option value="name"'+(f.sort==='name'?' selected':'')+'>이름순</option><option value="org"'+(f.sort==='org'?' selected':'')+'>기관순</option></select>';
  html += '<div class="count">'+filtered.length+' / '+classified.length+'건 표시</div>';
  html += '</div>';

  // sections
  STATUS_ORDER.forEach(function(g){
    var list = bySection[g];
    if (list.length === 0) return;
    var collapsed = !state.expanded[g] && !f.recent;
    html += '<div class="section'+(collapsed?' collapsed':'')+'" data-section="'+g+'">';
    html += '<div class="sec-head" data-toggle-section="'+g+'">';
    html += '<div class="sec-left"><span class="sec-bar" style="background:'+STATUS_META[g].color+'"></span><span class="sec-name">'+STATUS_META[g].name+'</span><span class="sec-count">'+list.length+'건</span></div>';
    html += '<span class="sec-chevron">▾</span>';
    html += '</div>';
    html += '<div class="sec-body">';
    list.forEach(function(it){
      html += renderItem(it);
    });
    html += '</div></div>';
  });

  if (filtered.length === 0){
    html += '<div class="empty-msg">조건에 맞는 항목이 없습니다.</div>';
  }

  // footer
  html += '<div class="footer-note">';
  html += '<span class="footer-text">이 페이지는 매주 자동으로 공개 자료를 다시 조사해 갱신돼요. 대기업 제한 검토는 공고문·사업계획서로 확인한 것만 확정이며, 미확인은 제한이 없다는 뜻이 아닙니다. 신청 전에는 반드시 공식 공고 원문을 확인하세요.</span>';
  html += '</div>';

  root.innerHTML = html;
  bindEvents();
  bindUpdateEvents();
}

function scrBadgeHtml(it){
  if (!it.scr || it.scr === '미검토') return '';
  var m = SCR_META[it.scr]; if (!m) return '';
  return '<span class="badge" style="background:'+m.bg+';color:'+m.c+'">대기업 '+esc(it.scr)+'</span>';
}
function studioBadgeHtml(it){
  if (!it.studio_n) return '';
  var m = STUDIO_N_META[it.studio_n];
  if (!m) return '<span class="badge" style="background:var(--muted-bg);color:var(--muted)">'+esc(it.studio_n)+'</span>';
  return '<span class="badge" style="background:'+m.bg+';color:'+m.color+'">'+esc(m.short)+'</span>';
}
function dueSoonBadge(it){
  if (it._cls.group !== 'pending' || it._cls.estDays === null || it._cls.estDays === undefined) return '';
  if (it._cls.estDays > 45) return '';
  var txt = it._cls.estDays < 0 ? '지난 회차 기준 공고 지연 중' : '곧 공고 예상 ('+fmtEstDate(it._cls.estNext)+')';
  return '<span class="badge" style="background:var(--warn-bg);color:var(--warn)">'+esc(txt)+'</span>';
}
function statusBadgeHtml(it){
  var g = it._cls.group;
  var meta = STATUS_META[g];
  var label = it._cls.label;
  return '<span class="badge" style="background:'+meta.bg+';color:'+meta.color+'">'+esc(label)+'</span>';
}

function renderItem(it){
  var open = !!state.openDetail[it.id];
  var meta = STATUS_META[it._cls.group];
  var html = '<div class="item" data-item="'+esc(it.id)+'">';
  html += '<div class="item-row" data-toggle-item="'+esc(it.id)+'">';
  html += '<div class="item-stripe" style="background:'+meta.color+'"></div>';
  html += '<div class="item-main">';
  html += '<div class="item-top"><span class="item-name">'+esc(it.name)+'</span>'+(it.isCustom?'<span class="custom-tag">직접추가</span>':'')+'</div>';
  html += '<div class="item-org">'+esc(it.org)+(it.field?' · '+esc(it.field):'')+'</div>';
  html += '<div class="item-tags">'+changeBadgeHtml(it)+statusBadgeHtml(it)+studioBadgeHtml(it)+scrBadgeHtml(it)+dueSoonBadge(it)+(it._meta.checked?'<span class="badge" style="background:var(--go-bg);color:var(--go)">확인함</span>':'')+'</div>';
  html += '</div>';
  if (it._cls.dday !== null){
    html += '<div class="item-dday" style="color:'+(it._cls.group==='now' && it._cls.dday<=(state.settings.alertDays||14) ? 'var(--urgent)' : 'var(--text-dim)')+'">';
    html += '<span class="num">'+(it._cls.dday>=0?'D-'+it._cls.dday:'D+'+Math.abs(it._cls.dday))+'</span>';
    html += '<span class="lbl">'+esc(fmtDate(it.end))+'</span>';
    html += '</div>';
  }
  html += '</div>';
  if (open) html += renderDetail(it);
  html += '</div>';
  return html;
}

function renderDetail(it){
  var html = '<div class="detail">';
  html += changeDetailHtml(it);
  html += '<div class="detail-grid">';
  if (it.scr && it.scr !== '미검토') html += detailField('대기업(상호출자제한기업집단) 제한 검토', it.scr + (it.scr_why ? ' — ' + it.scr_why : '') + (it.scr_src ? ' [근거: ' + it.scr_src + ']' : ''), true);
  if (it.unrel) html += detailField('사업 무관 분류', it.unrel + (it.unrel.indexOf('로케이션') === 0 ? ' — 촬영 지원금 신청·정산은 회사가 아니라 작품에 고용된 현장 스태프(로케이션 매니저 등)가 확인하는 업무라서 별도로 분류했습니다.' : ' — Studio N 업종(영화·드라마·방송영상·애니메이션 제작)과 직접 관련이 적어 별도로 분류했습니다.'), true);
  if (it.excl) html += detailField('제외 사유', it.excl, true);
  if (it.studio_n) html += detailField('Studio N 참여구조', it.studio_n + ' — 회사 내부자료(업종·규모·계열·IP·편성계약 등) 미검증 상태의 예비 판단입니다.', true);
  if (it.target) html += detailField('지원대상', it.target);
  if (it.benefit) html += detailField('지원내용', it.benefit);
  if (it.cap !== undefined) html += detailField('공고상 상한', money(it.cap));
  if (it.verify_level) html += detailField('검증 수준', it.verify_level + (it.checked_date ? ' · 확인일 '+it.checked_date : ''));
  if (it.caution) html += detailField('주의사항', it.caution, true);
  if (it.verify_issue) html += detailField('검증 이슈', it.verify_issue, true);
  if (it.next_action) html += detailField('다음 확인·조치', it.next_action, true);
  var links = '';
  if (it.official_url) links += '<a href="'+esc(it.official_url)+'" target="_blank" rel="noopener">공식 공고</a>';
  if (it.source_url && it.source_url !== it.official_url) links += (links?' &nbsp;·&nbsp; ':'')+'<a href="'+esc(it.source_url)+'" target="_blank" rel="noopener">확인 출처</a>';
  if (links) html += detailField('링크', links, true, true);
  if (it.contact) html += detailField('문의처', it.contact);
  html += '</div>';

  if (it._cls.group==='pending' && (it.start || it.end)){
    var noteTxt = '지난 회차 참고 접수기간: '+esc(it.start||'?')+' ~ '+esc(it.end||'?')+'.';
    if (it._cls.estNext) noteTxt += ' 매년 비슷한 시기라면 다음 공고는 '+fmtEstDate(it._cls.estNext)+' 경 예상되지만, 실제 공고는 반드시 직접 확인하세요.';
    else noteTxt += ' 다음 회차 공고는 별도 확인이 필요합니다.';
    html += '<div class="ref-note">'+noteTxt+'</div>';
  }

  html += '</div>';
  return html;
}
function detailField(label, value, isFull, isHtml){
  return '<div class="'+(isFull?'full':'')+'"><div class="dl">'+esc(label)+'</div><div class="dv">'+(isHtml?value:esc(value))+'</div></div>';
}

// ---------- events ----------
function bindEvents(){
  var alertInput = document.getElementById('gd-alert-input');
  if (alertInput) alertInput.addEventListener('change', function(e){
    var v = parseInt(e.target.value) || 14;
    state.settings.alertDays = v;
    saveSettings();
    render();
  });

  var search = document.getElementById('gd-search');
  if (search){
    search.addEventListener('input', function(e){
      state.filters.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById('gd-search');
      if (el){ el.focus(); el.setSelectionRange(pos,pos); }
    });
  }
  bindSelect('gd-filter-status','status');
  bindSelect('gd-filter-field','field');
  bindSelect('gd-filter-org','org');
  bindSelect('gd-filter-studio','studio');
  bindSelect('gd-filter-scr','scr');
  bindSelect('gd-sort','sort');

  root.querySelectorAll('[data-toggle-section]').forEach(function(el){
    el.addEventListener('click', function(){
      var g = el.getAttribute('data-toggle-section');
      state.expanded[g] = !state.expanded[g];
      render();
    });
  });

  root.querySelectorAll('[data-toggle-item]').forEach(function(el){
    el.addEventListener('click', function(ev){
      if (ev.target.closest('[data-checked]')) return;
      var id = el.getAttribute('data-toggle-item');
      state.openDetail[id] = !state.openDetail[id];
      render();
    });
  });

  root.querySelectorAll('[data-goto]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-goto');
      // expand relevant section + open detail, then scroll
      var items = allItems();
      var target = items.filter(function(i){return i.id===id;})[0];
      if (target){
        var cls = classify(target, todayMidnight());
        state.expanded[cls.group] = true;
      }
      state.openDetail[id] = true;
      render();
      setTimeout(function(){
        var itemEl = root.querySelector('[data-item="'+id.replace(/"/g,'')+'"]');
        if (itemEl) itemEl.scrollIntoView({behavior:'smooth', block:'center'});
      }, 30);
    });
  });

  root.querySelectorAll('[data-note]').forEach(function(el){
    el.addEventListener('blur', function(){
      var id = el.getAttribute('data-note');
      setMeta(id, { note: el.value });
    });
  });

  root.querySelectorAll('[data-checked]').forEach(function(el){
    el.addEventListener('change', function(){
      var id = el.getAttribute('data-checked');
      var today = todayMidnight();
      var ds = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
      setMeta(id, { checked: el.checked, checkedDate: el.checked ? ds : getMeta(id).checkedDate });
      render();
    });
  });

  root.querySelectorAll('[data-hide]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var id = el.getAttribute('data-hide');
      setMeta(id, { hidden: !getMeta(id).hidden });
      render();
    });
  });

  var toggleHidden = root.querySelector('[data-toggle-hidden]');
  if (toggleHidden) toggleHidden.addEventListener('click', function(){
    state.showHidden = !state.showHidden;
    render();
  });

  var toggleAdd = root.querySelector('[data-toggle-add]');
  if (toggleAdd) toggleAdd.addEventListener('click', function(){
    state.addOpen = !state.addOpen;
    render();
  });

  var submitAdd = root.querySelector('[data-submit-add]');
  if (submitAdd) submitAdd.addEventListener('click', function(){
    var org = document.getElementById('gd-new-org').value.trim();
    var name = document.getElementById('gd-new-name').value.trim();
    var end = document.getElementById('gd-new-end').value;
    var url = document.getElementById('gd-new-url').value.trim();
    var note = document.getElementById('gd-new-note').value.trim();
    if (!name){ alert('사업명을 입력해주세요.'); return; }
    var id = 'C' + Date.now();
    var item = {
      id: id, org: org || '미기재', name: name, field:null, type:null,
      target:null, benefit:null, cap:null, start:null, end: end || null,
      status_basis: end ? '공고상 접수기간 내' : '기간 미확인',
      caution:null, verify_level:'사용자 직접 추가', verify_issue:null,
      official_url: url || null, source_url:null, contact:null, next_action:null
    };
    state.custom.push(item);
    saveCustom();
    if (note) setMeta(id, { note: note });
    state.addOpen = false;
    render();
  });

  var exportBtn = root.querySelector('[data-export]');
  if (exportBtn) exportBtn.addEventListener('click', function(){
    var payload = { version:1, exportedAt: new Date().toISOString(), meta: state.meta, custom: state.custom, settings: state.settings };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'media-grants-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
  var importBtn = root.querySelector('[data-import]');
  var importFile = document.getElementById('gd-import-file');
  if (importBtn && importFile) importBtn.addEventListener('click', function(){ importFile.click(); });
  if (importFile) importFile.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var data = JSON.parse(ev.target.result);
        if (data.meta) state.meta = Object.assign({}, state.meta, data.meta);
        if (data.custom){
          var existingIds = {};
          state.custom.forEach(function(c){ existingIds[c.id]=1; });
          data.custom.forEach(function(c){ if(!existingIds[c.id]) state.custom.push(c); });
        }
        if (data.settings) state.settings = Object.assign(state.settings, data.settings);
        saveMeta(); saveCustom(); saveSettings();
        render();
        alert('가져오기 완료: 메모 · 확인 표시 · 직접 추가 항목을 반영했습니다.');
      } catch(err){
        alert('파일을 읽지 못했습니다. 이 화면에서 내보낸 백업 JSON 파일이 맞는지 확인해주세요.');
      }
    };
    reader.readAsText(file);
  });

  var resetAll = root.querySelector('[data-reset-all]');
  if (resetAll) resetAll.addEventListener('click', function(){
    if (!confirm('저장된 모든 메모·확인 표시·직접 추가한 항목을 초기화할까요? 되돌릴 수 없습니다.')) return;
    state.meta = {};
    state.custom = [];
    saveMeta(); saveCustom();
    render();
  });
}
function bindSelect(elId, key){
  var el = document.getElementById(elId);
  if (el) el.addEventListener('change', function(){
    state.filters[key] = el.value;
    render();
  });
}

loadState();
})();
</script>
</body>
</html>
